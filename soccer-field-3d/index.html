<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Soccer Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #555555; font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body.crop-5-2 { background: #1a1a1a; }

  /* The 3D canvas wrapper. Defaults to fullscreen; when cropped, becomes
     the largest 5:2 box that fits the viewport, centered. */
  #canvas-wrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  body.crop-5-2 #canvas-wrap {
    inset: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 5 / 2;
    width: min(100vw, 250vh);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
  }
  #canvas-wrap canvas { display: block; }

  /* Logo overlay always tracks the same 5:2 box, regardless of crop state. */
  #logo-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 5 / 2;
    width: min(100vw, 250vh);
    object-fit: fill;
    pointer-events: none;
    display: none;
    opacity: 0.5;
  }
  body.show-logo #logo-overlay { display: block; }

  #info {
    position: absolute; bottom: 12px; left: 12px;
    background: rgba(0,0,0,0.65); color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 11px;
    line-height: 1.5; pointer-events: none; user-select: none;
  }

  .controls {
    position: absolute; top: 12px; right: 12px;
    display: flex; flex-direction: row; gap: 8px;
    align-items: flex-start;
    z-index: 10;
  }
  .control-stack {
    display: flex; flex-direction: column; gap: 8px;
    align-items: stretch;
  }
  .row { display: flex; gap: 8px; align-items: center; }

  button, label.btn {
    padding: 8px 14px; background: #222; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-size: 12px;
    font-family: inherit;
  }
  button:hover, label.btn:hover { background: #333; }
  button:disabled { background: #1a1a1a; color: #555; cursor: not-allowed; }
  select {
    padding: 8px 10px; background: #222; color: #fff;
    border: none; border-radius: 6px; font-size: 12px; font-family: inherit;
  }
  .panel {
    background: rgba(0,0,0,0.65); color: #fff;
    padding: 10px 12px; border-radius: 6px;
    display: flex; flex-direction: column; gap: 8px;
    font-size: 12px;
    min-width: 260px;
  }
  .panel .label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; }
  .panel .filename {
    font-size: 11px; color: #aaa;
    flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .toggle input { margin: 0; accent-color: #5b79ff; cursor: pointer; }
  .toggle.disabled { opacity: 0.4; cursor: not-allowed; }
  .toggle.disabled input { cursor: not-allowed; }
  input[type="range"] { flex: 1; accent-color: #fff; }
  #fileInput { display: none; }
  .opacity-val { width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<img id="logo-overlay" alt="" />

<div id="info">
  Drag to orbit. Scroll to zoom. Right-click drag to pan.
</div>

<div class="controls">
  <div class="panel">
    <span class="label">Logo overlay</span>
    <div class="row">
      <label class="btn" for="fileInput">Load image</label>
      <button id="clearImage" disabled>Clear</button>
    </div>
    <span class="filename" id="filename">no image loaded</span>
    <label class="toggle disabled" id="showLogoLabel">
      <input type="checkbox" id="showLogo" disabled>
      <span>Preview logo</span>
    </label>
    <div class="row">
      <span style="color:#aaa">Opacity</span>
      <input type="range" id="opacity" min="0" max="100" value="50" disabled>
      <span class="opacity-val" id="opacityVal">50%</span>
    </div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="control-stack">
    <div class="row">
      <select id="preset">
        <option value="default">View: Default</option>
        <option value="top">View: Top-down</option>
        <option value="broadcast">View: Broadcast</option>
        <option value="corner">View: Corner</option>
        <option value="goal">View: Behind Goal</option>
      </select>
      <select id="lens">
        <option value="24">Lens: Wide (24mm)</option>
        <option value="50" selected>Lens: Normal (50mm)</option>
        <option value="85">Lens: Tele (85mm)</option>
      </select>
    </div>
    <button id="screenshot">Download PNG</button>

    <div class="panel">
      <label class="toggle">
        <input type="checkbox" id="crop52">
        <span>View in 5:2</span>
      </label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// =========================
// FIFA pitch dimensions (m)
// =========================
const FIELD_L = 105;
const FIELD_W = 68;
const GOAL_AREA_W = 18.32;
const GOAL_AREA_D = 5.5;
const PEN_AREA_W = 40.32;
const PEN_AREA_D = 16.5;
const PEN_SPOT_DIST = 11;
const CENTER_R = 9.15;
const PEN_ARC_R = 9.15;
const CORNER_R = 1;
const GOAL_W = 7.32;
const GOAL_H = 2.44;
const GOAL_D = 2;
const LINE_W = 0.12;
const MARGIN = 5;

// =========================
// Build field markings as a canvas texture
// =========================
function makeFieldTexture() {
  const ppm = 20;
  const totalW = FIELD_L + MARGIN * 2;
  const totalH = FIELD_W + MARGIN * 2;
  const c = document.createElement('canvas');
  c.width = totalW * ppm;
  c.height = totalH * ppm;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#6d6d6d';
  ctx.fillRect(0, 0, c.width, c.height);

  const stripeCount = 13;
  const stripeH = (FIELD_W / stripeCount) * ppm;
  for (let i = 0; i < stripeCount; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#9a9a9a' : '#888888';
    ctx.fillRect(MARGIN * ppm, MARGIN * ppm + i * stripeH, FIELD_L * ppm, stripeH);
  }

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = LINE_W * ppm;
  ctx.lineCap = 'butt';

  const m = (v) => (MARGIN + v) * ppm;

  ctx.strokeRect(m(0), m(0), FIELD_L * ppm, FIELD_W * ppm);

  ctx.beginPath();
  ctx.moveTo(m(FIELD_L / 2), m(0));
  ctx.lineTo(m(FIELD_L / 2), m(FIELD_W));
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(m(FIELD_L / 2), m(FIELD_W / 2), CENTER_R * ppm, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(m(FIELD_L / 2), m(FIELD_W / 2), 0.18 * ppm, 0, Math.PI * 2);
  ctx.fill();

  const arcHalfAngle = Math.acos((PEN_AREA_D - PEN_SPOT_DIST) / PEN_ARC_R);

  ctx.strokeRect(m(0), m((FIELD_W - PEN_AREA_W) / 2), PEN_AREA_D * ppm, PEN_AREA_W * ppm);
  ctx.strokeRect(m(0), m((FIELD_W - GOAL_AREA_W) / 2), GOAL_AREA_D * ppm, GOAL_AREA_W * ppm);
  ctx.beginPath();
  ctx.arc(m(PEN_SPOT_DIST), m(FIELD_W / 2), 0.18 * ppm, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(m(PEN_SPOT_DIST), m(FIELD_W / 2), PEN_ARC_R * ppm, -arcHalfAngle, arcHalfAngle);
  ctx.stroke();

  ctx.strokeRect(m(FIELD_L - PEN_AREA_D), m((FIELD_W - PEN_AREA_W) / 2), PEN_AREA_D * ppm, PEN_AREA_W * ppm);
  ctx.strokeRect(m(FIELD_L - GOAL_AREA_D), m((FIELD_W - GOAL_AREA_W) / 2), GOAL_AREA_D * ppm, GOAL_AREA_W * ppm);
  ctx.beginPath();
  ctx.arc(m(FIELD_L - PEN_SPOT_DIST), m(FIELD_W / 2), 0.18 * ppm, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(m(FIELD_L - PEN_SPOT_DIST), m(FIELD_W / 2), PEN_ARC_R * ppm,
          Math.PI - arcHalfAngle, Math.PI + arcHalfAngle);
  ctx.stroke();

  const corners = [
    [0, 0, 0, Math.PI / 2],
    [FIELD_L, 0, Math.PI / 2, Math.PI],
    [FIELD_L, FIELD_W, Math.PI, Math.PI * 1.5],
    [0, FIELD_W, Math.PI * 1.5, Math.PI * 2],
  ];
  for (const [cx, cy, a1, a2] of corners) {
    ctx.beginPath();
    ctx.arc(m(cx), m(cy), CORNER_R * ppm, a1, a2);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 16;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  return tex;
}

// =========================
// Scene
// =========================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x555555);

const camera = new THREE.PerspectiveCamera(27, 1, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const canvasWrap = document.getElementById('canvas-wrap');
canvasWrap.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 500;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(40, 90, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -90;
sun.shadow.camera.right = 90;
sun.shadow.camera.top = 70;
sun.shadow.camera.bottom = -70;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 250;
sun.shadow.bias = -0.0005;
scene.add(sun);

// =========================
// Field surface
// =========================
const fieldGeo = new THREE.PlaneGeometry(FIELD_L + MARGIN * 2, FIELD_W + MARGIN * 2);
const fieldMat = new THREE.MeshLambertMaterial({ map: makeFieldTexture() });
const field = new THREE.Mesh(fieldGeo, fieldMat);
field.rotation.x = -Math.PI / 2;
field.receiveShadow = true;
scene.add(field);

// =========================
// Goals + nets
// =========================
function makeGoal(goalX, netDir) {
  const g = new THREE.Group();
  const postR = 0.06;
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });

  const postGeo = new THREE.CylinderGeometry(postR, postR, GOAL_H, 16);
  for (const z of [-GOAL_W / 2, GOAL_W / 2]) {
    const post = new THREE.Mesh(postGeo, mat);
    post.position.set(goalX, GOAL_H / 2, z);
    post.castShadow = true;
    g.add(post);
  }

  const bar = new THREE.Mesh(
    new THREE.CylinderGeometry(postR, postR, GOAL_W, 16),
    mat
  );
  bar.position.set(goalX, GOAL_H, 0);
  bar.rotation.x = Math.PI / 2;
  bar.castShadow = true;
  g.add(bar);

  // Back-of-goal armature: two short side poles sitting just behind the
  // back wall of the net, with ropes running from each pole top down to
  // the back-top corner of the net. The net is a clean rectangular box
  // at crossbar height; the ropes are external support only.
  const backX = goalX + netDir * GOAL_D;             // back wall of net
  const backPoleX = goalX + netDir * (GOAL_D + 0.6); // pole just behind net
  const BACK_POLE_H = GOAL_H + 0.3;                   // slightly above crossbar
  const w2 = GOAL_W / 2;

  const backPostGeo = new THREE.CylinderGeometry(postR * 0.7, postR * 0.7, BACK_POLE_H, 16);
  for (const z of [-w2, w2]) {
    const backPost = new THREE.Mesh(backPostGeo, mat);
    backPost.position.set(backPoleX, BACK_POLE_H / 2, z);
    backPost.castShadow = true;
    g.add(backPost);
  }

  // Ropes: from back-pole top down-and-forward to the back-top corner of
  // the net (at crossbar height).
  const cableMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
  function addCable(z) {
    const start = new THREE.Vector3(backPoleX, BACK_POLE_H, z);
    const end = new THREE.Vector3(backX, GOAL_H, z);
    const dir = new THREE.Vector3().subVectors(end, start);
    const len = dir.length();
    const cable = new THREE.Mesh(
      new THREE.CylinderGeometry(0.012, 0.012, len, 8),
      cableMat
    );
    cable.position.copy(start).addScaledVector(dir, 0.5);
    cable.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      dir.clone().normalize()
    );
    cable.castShadow = true;
    g.add(cable);
  }
  addCable(-w2);
  addCable(w2);

  const netLineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
  const gridSize = 0.22;

  function gridPanel(p1, p2, p3, p4) {
    const divsU = Math.max(2, Math.round(p1.distanceTo(p2) / gridSize));
    const divsV = Math.max(2, Math.round(p1.distanceTo(p4) / gridSize));
    const positions = [];
    for (let i = 0; i <= divsV; i++) {
      const t = i / divsV;
      const a = new THREE.Vector3().lerpVectors(p1, p4, t);
      const b = new THREE.Vector3().lerpVectors(p2, p3, t);
      positions.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
    for (let i = 0; i <= divsU; i++) {
      const t = i / divsU;
      const a = new THREE.Vector3().lerpVectors(p1, p2, t);
      const b = new THREE.Vector3().lerpVectors(p4, p3, t);
      positions.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    return new THREE.LineSegments(geo, netLineMat);
  }

  // Net: clean rectangular box at GOAL_H, open at front and bottom.
  // Back panel (vertical wall at backX).
  g.add(gridPanel(
    new THREE.Vector3(backX, GOAL_H, -w2),
    new THREE.Vector3(backX, GOAL_H, w2),
    new THREE.Vector3(backX, 0, w2),
    new THREE.Vector3(backX, 0, -w2),
  ));
  // Top panel (horizontal at GOAL_H).
  g.add(gridPanel(
    new THREE.Vector3(goalX, GOAL_H, -w2),
    new THREE.Vector3(goalX, GOAL_H, w2),
    new THREE.Vector3(backX, GOAL_H, w2),
    new THREE.Vector3(backX, GOAL_H, -w2),
  ));
  // Side panels (vertical rectangles).
  g.add(gridPanel(
    new THREE.Vector3(goalX, GOAL_H, -w2),
    new THREE.Vector3(backX, GOAL_H, -w2),
    new THREE.Vector3(backX, 0, -w2),
    new THREE.Vector3(goalX, 0, -w2),
  ));
  g.add(gridPanel(
    new THREE.Vector3(goalX, GOAL_H, w2),
    new THREE.Vector3(backX, GOAL_H, w2),
    new THREE.Vector3(backX, 0, w2),
    new THREE.Vector3(goalX, 0, w2),
  ));

  return g;
}

scene.add(makeGoal(-FIELD_L / 2, -1));
scene.add(makeGoal( FIELD_L / 2,  1));

// =========================
// Corner flags
// =========================
function makeFlag(x, z) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.025, 0.025, 1.5, 8),
    new THREE.MeshLambertMaterial({ color: 0xeeeeee })
  );
  pole.position.set(x, 0.75, z);
  pole.castShadow = true;
  g.add(pole);

  const flag = new THREE.Mesh(
    new THREE.PlaneGeometry(0.4, 0.25),
    new THREE.MeshLambertMaterial({ color: 0x222222, side: THREE.DoubleSide })
  );
  const sx = x > 0 ? -1 : 1;
  flag.position.set(x + sx * 0.2, 1.35, z);
  g.add(flag);
  return g;
}

[[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sz]) => {
  scene.add(makeFlag(sx * FIELD_L / 2, sz * FIELD_W / 2));
});

// =========================
// View presets
// =========================
const presets = {
  default:   { pos: [90, 80, 110], target: [0, 0, 0] },
  top:       { pos: [0, 165, 0.2], target: [0, 0, 0] },
  broadcast: { pos: [0, 50, 110],  target: [0, 0, 0] },
  corner:    { pos: [100, 35, 75], target: [0, 0, 0] },
  goal:      { pos: [-FIELD_L/2 - 28, 8, 0], target: [0, 1, 0] },
};

function applyPreset(name) {
  const p = presets[name];
  if (!p) return;
  camera.position.set(...p.pos);
  controls.target.set(...p.target);
  controls.update();
}
applyPreset('default');

document.getElementById('preset').addEventListener('change', (e) => {
  applyPreset(e.target.value);
});

// =========================
// Lens (FOV) presets, full-frame 35mm equivalents
// =========================
function applyLens(focalMm) {
  const sensorH = 24;
  const newFov = 2 * Math.atan(sensorH / (2 * focalMm)) * 180 / Math.PI;
  const oldFov = camera.fov;

  const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
  const oldDist = offset.length();
  const newDist = oldDist * Math.tan((oldFov / 2) * Math.PI / 180) / Math.tan((newFov / 2) * Math.PI / 180);

  camera.fov = newFov;
  camera.updateProjectionMatrix();
  offset.setLength(THREE.MathUtils.clamp(newDist, controls.minDistance, controls.maxDistance));
  camera.position.copy(controls.target).add(offset);
  controls.update();
}

document.getElementById('lens').addEventListener('change', (e) => {
  applyLens(parseFloat(e.target.value));
});

// =========================
// Renderer sizing: track the canvas wrapper, which may be fullscreen or 5:2.
// =========================
function fitRenderer() {
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
new ResizeObserver(fitRenderer).observe(canvasWrap);
fitRenderer();

// =========================
// 5:2 crop toggle
// =========================
const crop52 = document.getElementById('crop52');
crop52.addEventListener('change', () => {
  document.body.classList.toggle('crop-5-2', crop52.checked);
});

// =========================
// Logo overlay controls
// =========================
const fileInput = document.getElementById('fileInput');
const filenameEl = document.getElementById('filename');
const clearBtn = document.getElementById('clearImage');
const showLogo = document.getElementById('showLogo');
const showLogoLabel = document.getElementById('showLogoLabel');
const opacitySlider = document.getElementById('opacity');
const opacityVal = document.getElementById('opacityVal');
const logoImg = document.getElementById('logo-overlay');

function setLogoEnabled(enabled) {
  showLogo.disabled = !enabled;
  opacitySlider.disabled = !enabled;
  showLogoLabel.classList.toggle('disabled', !enabled);
  clearBtn.disabled = !enabled;
}

function applyLogoVisibility() {
  const show = showLogo.checked && !!logoImg.src;
  document.body.classList.toggle('show-logo', show);
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  if (logoImg.dataset.objectUrl) URL.revokeObjectURL(logoImg.dataset.objectUrl);
  logoImg.dataset.objectUrl = url;
  logoImg.src = url;
  filenameEl.textContent = file.name;
  filenameEl.title = file.name;
  setLogoEnabled(true);
  showLogo.checked = true;
  applyLogoVisibility();
});

clearBtn.addEventListener('click', () => {
  if (logoImg.dataset.objectUrl) URL.revokeObjectURL(logoImg.dataset.objectUrl);
  logoImg.removeAttribute('src');
  delete logoImg.dataset.objectUrl;
  filenameEl.textContent = 'no image loaded';
  filenameEl.title = '';
  showLogo.checked = false;
  setLogoEnabled(false);
  applyLogoVisibility();
  fileInput.value = '';
});

showLogo.addEventListener('change', applyLogoVisibility);

opacitySlider.addEventListener('input', (e) => {
  const v = parseInt(e.target.value, 10);
  logoImg.style.opacity = (v / 100).toString();
  opacityVal.textContent = v + '%';
});

setLogoEnabled(false);

// Try to load a bundled default logo from ./default-logo.png. If it loads,
// auto-enable both the logo overlay and the 5:2 crop so the page opens with
// the full preview composition. If the file is missing, fall back silently.
(function tryLoadDefaultLogo() {
  const url = './default-logo.png';
  const test = new Image();
  test.onload = () => {
    logoImg.src = url;
    filenameEl.textContent = 'default-logo.png';
    filenameEl.title = url;
    setLogoEnabled(true);
    showLogo.checked = true;
    crop52.checked = true;
    document.body.classList.add('crop-5-2');
    applyLogoVisibility();
  };
  test.src = url;
})();

// =========================
// Screenshot: composite renderer + logo overlay into a single PNG.
// Logo is positioned to match its on-screen 5:2 box within the canvas.
// =========================
document.getElementById('screenshot').addEventListener('click', () => {
  renderer.render(scene, camera);
  const cw = renderer.domElement.width;
  const ch = renderer.domElement.height;

  const out = document.createElement('canvas');
  out.width = cw;
  out.height = ch;
  const ctx = out.getContext('2d');
  ctx.drawImage(renderer.domElement, 0, 0);

  const logoShown = document.body.classList.contains('show-logo') && logoImg.src;
  if (logoShown) {
    const lw = Math.min(cw, ch * 2.5);
    const lh = lw / 2.5;
    const lx = (cw - lw) / 2;
    const ly = (ch - lh) / 2;
    ctx.globalAlpha = parseInt(opacitySlider.value, 10) / 100;
    ctx.drawImage(logoImg, lx, ly, lw, lh);
    ctx.globalAlpha = 1;
  }

  const link = document.createElement('a');
  link.download = `soccer-field-${Date.now()}.png`;
  link.href = out.toDataURL('image/png');
  link.click();
});

// =========================
// Loop
// =========================
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
