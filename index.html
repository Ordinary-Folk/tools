<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordinary Folk Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --bg: #fafaf9;
  --text: #1a1a1a;
  --muted: #6f6e6a;
  --card: #ffffff;
  --card-hover: #f4f4f2;
  --border: rgba(0, 0, 0, 0.08);
  --tile: #2b2b2e;
  --tile-text: #f5f5f3;
  --accent: #5b79ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f10;
    --text: #f0efed;
    --muted: #9a9a96;
    --card: #18181a;
    --card-hover: #202023;
    --border: rgba(255, 255, 255, 0.08);
    --tile: #2b2b2e;
    --tile-text: #f5f5f3;
  }
}
* { box-sizing: border-box; }
body {
  font-family: 'Geist', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; margin-bottom: 2.75rem;
}
.brand { display: flex; align-items: center; gap: 0.6rem; }
.brand img { height: 26px; width: auto; }
h1 { font-weight: 600; font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.account { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 0.6rem; }
.account a { color: var(--muted); text-decoration: none; border: 0.5px solid var(--border); padding: 0.3rem 0.7rem; border-radius: 7px; transition: color 0.15s, border-color 0.15s; }
.account a:hover { color: var(--text); border-color: var(--muted); }
#email { font-variant: tabular-nums; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 1.1rem;
}
.card {
  display: flex; flex-direction: column;
  background: var(--card);
  border: 0.5px solid var(--border);
  border-radius: 14px;
  padding: 1.1rem;
  text-decoration: none;
  color: inherit;
  transition: background 0.15s, transform 0.1s, border-color 0.15s;
}
.card:hover { background: var(--card-hover); border-color: var(--muted); }
.card:active { transform: scale(0.99); }
.tile {
  width: 100%; aspect-ratio: 1 / 1;
  background: var(--tile); color: var(--tile-text);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 0.85rem;
}
.tile svg { width: 38%; height: 38%; }
.card h2 { font-size: 15px; font-weight: 500; margin: 0 0 2px; }
.card .desc { font-size: 12.5px; color: var(--muted); }
.card.soon { pointer-events: none; opacity: 0.55; }
.card.soon .badge {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); margin-top: 4px;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="https://pub-56e21cb169af4746be142655f1882554.r2.dev/tools/of-logo.svg" alt="Ordinary Folk">
      <h1>Tools</h1>
    </div>
    <div class="account">
      <span id="email"></span>
      <a href="/cdn-cgi/access/logout">Log out</a>
    </div>
  </header>

  <div class="grid">
    <a class="card" href="/review/">
      <div class="tile">
        <!-- film / review -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>
      </div>
      <h2>OF Review</h2>
      <span class="desc">Frame-accurate video review &amp; comments</span>
    </a>

    <div class="card soon">
      <div class="tile">
        <!-- calendar / schedule -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>
      </div>
      <h2>Master Schedule</h2>
      <span class="desc">Production schedule</span>
      <span class="badge">Coming soon</span>
    </div>
  </div>
</div>

<script>
  // Show the signed-in OF account (provided by Cloudflare Access, same-origin).
  fetch('/cdn-cgi/access/get-identity')
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => { if (d && d.email) document.getElementById('email').textContent = d.email; })
    .catch(() => {});
</script>
</body>
</html>
