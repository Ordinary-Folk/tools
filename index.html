<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordinary Folk tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --bg: #fafaf9;
  --text: #1a1a1a;
  --muted: #6f6e6a;
  --border: rgba(0, 0, 0, 0.08);
  --accent: #5b79ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f10;
    --text: #f0efed;
    --muted: #9a9a96;
    --border: rgba(255, 255, 255, 0.08);
  }
}
* { box-sizing: border-box; }
body {
  font-family: 'Geist', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 560px;
  margin: 4rem auto;
  padding: 0 1.5rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1 { font-weight: 500; font-size: 22px; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
.tagline { color: var(--muted); margin: 0 0 2.5rem; font-size: 14px; }
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.5rem; }
ul { list-style: none; padding: 0; margin: 0; }
li {
  padding: 0.9rem 0;
  border-bottom: 0.5px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
li:last-child { border-bottom: none; }
a {
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  font-size: 15px;
  transition: color 0.15s;
}
a:hover { color: var(--accent); }
.desc { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<h1>Tools</h1>
<p class="tagline">Internal utilities for Ordinary Folk.</p>
<div class="section-label">Available</div>
<ul>
<li>
  <a href="./g-gradient-26/">g-gradient-26</a>
  <span class="desc">Three-stop gradient with light and dark mode variants</span>
</li>
<li>
  <a href="./soccer-field-3d/">soccer-field-3d</a>
  <span class="desc">3D soccer field at 5:2 ratio with image overlay and opacity control</span>
</li>
</ul>
</body>
</html>
